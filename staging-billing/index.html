<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لولو | الاشتراكات</title><link rel="stylesheet" href="/billing.css"><script src="/billing.js" defer></script></head><body><main><header><small>LOLO LEARNING / STAGING</small><h1>رحلة تعليمية أذكى</h1><p>الباقات والاشتراكات — تجربة محلية ببيانات اصطناعية فقط، لا يتم خصم أموال أو طلب بيانات بطاقات.</p></header><form id="login"><h2>دخول ولي الأمر التجريبي</h2><label>البريد الإلكتروني التجريبي<input id="email" type="email" required autocomplete="off"></label><label>كلمة المرور<input id="password" type="password" required autocomplete="off"></label><button>دخول</button></form><div id="account" hidden><section><div class="bar"><h2>اشتراكك الحالي</h2><button id="logout" type="button">خروج</button></div><p id="current"></p><p id="expiry"></p><div class="usage"><label>رصيد المحادثة<progress id="voice"></progress><span id="voiceText"></span></label><label>تقييم النطق<progress id="pronunciation"></progress><span id="pronunciationText"></span></label></div><button id="refresh">تحديث</button></section><section><h2>اختر الباقة المناسبة</h2><label>مدة الاشتراك<select id="period"><option value="monthly">شهري</option><option value="yearly">سنوي</option></select></label><div id="plans" class="plans"></div><div id="quote" hidden><h3>مراجعة الطلب التجريبي</h3><p id="quoteText"></p><label>كود خصم (اختياري)<input id="discountCode" maxlength="37" autocomplete="off"></label><button id="applyDiscount" type="button">احسب الخصم</button><label class="check"><input id="confirm" type="checkbox">أؤكد السعر ومدة الاشتراك التجريبي.</label><button id="create" disabled>إنشاء طلب تجريبي</button></div></section><section><h2>كود تجربة الاشتراك</h2><label>الكود<input id="trialCode" maxlength="37" autocomplete="off"></label><button id="redeemTrial" type="button">تفعيل التجربة</button></section><section><h2>الطلاب المشمولون</h2><p id="slotLimit"></p><div id="children"></div></section><section><h2>طلبات الاشتراك</h2><div id="orders"></div></section></div><p id="status" role="status" aria-live="polite"></p></main></body></html>
