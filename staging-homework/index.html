<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لولو | تجربة الواجبات</title><link rel="stylesheet" href="/preview.css"></head><body><main><header><small>LOLO LEARNING / STAGING</small><h1>تسليم الواجبات</h1><p>بيئة اختبار محلية فقط. يولّد الخادم صورة واجب اصطناعية ثابتة؛ لا يمكنك رفع صور شخصية.</p></header><form id="login"><h2>دخول ولي الأمر التجريبي</h2><label>البريد التجريبي<input id="email" type="email" required autocomplete="off"></label><label>كلمة المرور<input id="password" type="password" required autocomplete="off"></label><button>دخول</button></form><section id="account" hidden><div class="bar"><h2>الواجبات</h2><button id="logout" type="button">خروج</button></div><label>ملف الطالب التجريبي<select id="child"></select></label><form id="upload"><label>الواجب التجريبي المتاح<select id="assignment" required></select></label><p>سيتم توليد ورقة تدريب حسابية تجريبية من الخادم.</p><label class="check"><input id="confirm" type="checkbox" required>أوافق على إنشاء وتسليم صورة الاختبار الاصطناعية.</label><button>إرسال الواجب</button></form><button id="refresh" type="button">تحديث قائمة الواجبات</button><div id="submissions"></div></section><p id="status" role="status" aria-live="polite"></p></main><script src="/preview.js"></script></body></html>
