<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لولو | تجربة الواجبات</title><link rel="stylesheet" href="/preview.css"></head><body><main><header><small>LOLO LEARNING / STAGING</small><h1>تسليم الواجبات</h1><p>بيئة اختبار محلية فقط. استخدم صورًا وبيانات اصطناعية، لا صور أطفال أو معلومات حقيقية.</p></header><form id="login"><h2>دخول ولي الأمر التجريبي</h2><label>البريد التجريبي<input id="email" type="email" required autocomplete="off"></label><label>كلمة المرور<input id="password" type="password" required autocomplete="off"></label><button>دخول</button></form><section id="account" hidden><div class="bar"><h2>الواجبات</h2><button id="logout" type="button">خروج</button></div><label>ملف الطالب التجريبي<select id="child"></select></label><form id="upload"><label>معرّف الواجب التجريبي<input id="assignment" required maxlength="64" placeholder="synthetic-example"></label><label>صورة تجريبية (PNG أو JPEG، حتى 2 MB)<input id="image" type="file" accept="image/png,image/jpeg" required></label><img id="preview" alt="معاينة الصورة المختارة" hidden><label class="check"><input id="confirm" type="checkbox" required>أؤكد أن الصورة اصطناعية ولا تحتوي معلومات أو صورًا لأشخاص حقيقيين.</label><button>إرسال الواجب</button></form><button id="refresh" type="button">تحديث قائمة الواجبات</button><div id="submissions"></div></section><p id="status" role="status" aria-live="polite"></p></main><script src="/preview.js"></script></body></html>
