<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لولو | مراجعة الواجبات التجريبية</title><link rel="stylesheet" href="/preview.css"></head><body><main><header><small>LOLO LEARNING / STAGING</small><h1>لوحة المعلم</h1><p>بيانات اصطناعية فقط. تظهر الواجبات المصرح لك بها.</p></header><form id="login"><h2>دخول المعلم التجريبي</h2><label>البريد<input id="email" type="email" required></label><label>كلمة المرور<input id="password" type="password" required></label><label>رمز التحقق<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><button>دخول</button></form><section id="account" hidden><div class="bar"><h2>قائمة التصحيح</h2><button id="logout" type="button">خروج</button></div><button id="refresh" type="button">تحديث القائمة</button><div id="list"></div><form id="review" hidden><h2>مراجعة الواجب</h2><img id="image" alt="صورة الواجب التجريبي"><label>النتيجة<select id="outcome"><option value="reviewed">تم التصحيح</option><option value="revise">إعادة التسليم</option></select></label><label id="scoreLabel">الدرجة من 100<input id="score" type="number" min="0" max="100" step="1" required></label><label>ملاحظات المعلم<textarea id="feedback" maxlength="500" required></textarea></label><button>حفظ التصحيح</button><button id="close" type="button">إغلاق</button></form></section><p id="status" role="status" aria-live="polite"></p></main><script src="/teacher.js"></script></body></html>
