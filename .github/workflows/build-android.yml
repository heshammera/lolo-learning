name: Build Lolo Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-apk/**'
      - 'assets/branding/**'
      - 'scripts/generate_brand_assets.py'
      - 'app.js'
      - 'assessment-engine.js'
      - 'visual-question-bank.js'
      - 'visual-assessment-engine.js'
      - 'curriculum-engine.js'
      - 'learning-engine.js'
      - 'learning-path-engine.js'
      - 'network.js'
      - 'offline-assets.js'
      - 'offline.html'
      - 'sw.js'
      - 'parent-gate.js'
      - 'curriculum.json'
      - 'scripts/**'
      - 'index.html'
      - 'server.py'
      - 'tests/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-apk
    steps:
      - name: Check out project
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-apk/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: npm ci
      - name: Run local security and storage tests
        run: |
          cd ..
          python3 -m unittest discover -s tests -v
          node tests/storage.test.cjs
          node tests/assessment-engine.test.cjs
          node --test tests/visual-assessment.test.cjs
          node tests/curriculum-engine.test.cjs
          node tests/learning-engine.test.cjs
          node --test tests/learning-path-engine.test.cjs
          node --check app.js
          node --check learning-path-engine.js
          node --check network.js
          node --check sw.js
          node --test tests/offline.test.cjs
          python3 -m py_compile server.py
          node tests/parent-gate.test.cjs
          node scripts/validate-curriculum.js
          node tests/session-timers.test.cjs
      - name: Browser offline smoke tests
        working-directory: .
        run: |
          npm install --prefix "$RUNNER_TEMP/lolo-browser-tests" --no-package-lock --no-save playwright@1.56.1
          "$RUNNER_TEMP/lolo-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/lolo-browser-tests/node_modules" node tests/browser-offline.cjs
      - name: Build debug APK
        run: |
          npm run prepare:web
          npx cap sync android
          test -f android/app/src/main/assets/public/curriculum.json
          test -f android/app/src/main/assets/public/network.js
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: lolo-android-debug-apk
          path: android-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
