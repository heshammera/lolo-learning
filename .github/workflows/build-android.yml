name: Build Lolo Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-apk/**'
      - 'assets/branding/**'
      - 'scripts/generate_brand_assets.py'
      - 'app.js'
      - 'assessment-engine.js'
      - 'curriculum-engine.js'
      - 'curriculum.json'
      - 'scripts/**'
      - 'index.html'
      - 'server.py'
      - 'tests/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-apk
    steps:
      - name: Check out project
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-apk/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: npm ci
      - name: Run local security and storage tests
        run: |
          cd ..
          python3 -m unittest discover -s tests -v
          node tests/storage.test.cjs
          node tests/assessment-engine.test.cjs
          node tests/curriculum-engine.test.cjs
          node scripts/validate-curriculum.js
          node tests/session-timers.test.cjs
      - name: Build debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: lolo-android-debug-apk
          path: android-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
