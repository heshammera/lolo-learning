name: Build Lolo Android APK

on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Build a signed release from main (requires operator signing secrets)'
        type: boolean
        default: false
  push:
    paths:
      - 'android-apk/**'
      - 'assets/branding/**'
      - 'scripts/generate_brand_assets.py'
      - 'app.js'
      - 'assessment-engine.js'
      - 'subject-catalog.js'
      - 'visual-question-bank.js'
      - 'visual-assessment-engine.js'
      - 'curriculum-engine.js'
      - 'learning-engine.js'
      - 'learning-analytics.js'
      - 'learning-path-engine.js'
      - 'network.js'
      - 'family-client.js'
      - 'activity-engine.js'
      - 'activity-pilot.js'
      - 'content-schema.js'
      - 'content-package.js'
      - 'content-install.js'
      - 'content-trust.js'
      - 'content-runtime.js'
      - 'content-progress.js'
      - 'offline-license.js'
      - 'offline-license-vault.js'
      - 'content-client.js'
      - 'content_delivery.py'
      - 'api/content.py'
      - 'admin-src/**'
      - 'progress_sync.py'
      - 'offline-assets.js'
      - 'offline.html'
      - 'sw.js'
      - 'parent-gate.js'
      - 'curriculum.json'
      - 'scripts/**'
      - 'index.html'
      - 'server.py'
      - 'family_accounts.py'
      - 'api/family.py'
      - 'database/**'
      - 'requirements.txt'
      - 'requirements-homework-staging.txt'
      - 'homework_storage.py'
      - 'homework_review.py'
      - 'tests/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      LOLO_ANDROID_VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: android-apk
    steps:
      - name: Check out project
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-apk/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Enforce release branch
        if: inputs.signed_release && github.ref != 'refs/heads/main'
        run: exit 1
      - name: Install packages
        run: npm ci
      - name: Run local security and storage tests
        run: |
          cd ..
          python3 -m venv "$RUNNER_TEMP/lolo-python-tests"
          "$RUNNER_TEMP/lolo-python-tests/bin/pip" install -r requirements-homework-staging.txt
          "$RUNNER_TEMP/lolo-python-tests/bin/python" -m unittest discover -s tests -v
          node tests/storage.test.cjs
          node tests/assessment-engine.test.cjs
          node --test tests/visual-assessment.test.cjs tests/subject-catalog.test.cjs
          node tests/curriculum-engine.test.cjs
          node tests/learning-engine.test.cjs
          node --test tests/learning-analytics.test.cjs
          node --test tests/learning-path-engine.test.cjs
          node --test tests/offline-license-vault.test.cjs
          node --check app.js
          node --check learning-path-engine.js
          node --check network.js
          node --check sw.js
          node --test tests/offline.test.cjs tests/family-client.test.cjs tests/activity-engine.test.cjs tests/activity-library.test.cjs tests/content-package.test.cjs tests/content-runtime.test.cjs tests/content-progress.test.cjs tests/content-client.test.cjs
          python3 -m py_compile server.py
          node tests/parent-gate.test.cjs
          node scripts/validate-curriculum.js
          node tests/session-timers.test.cjs
      - name: Browser offline smoke tests
        working-directory: .
        run: |
          npm install --prefix "$RUNNER_TEMP/lolo-browser-tests" --no-package-lock --no-save playwright@1.56.1
          "$RUNNER_TEMP/lolo-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/lolo-browser-tests/node_modules" node tests/browser-offline.cjs
          NODE_PATH="$RUNNER_TEMP/lolo-browser-tests/node_modules" node tests/content-install-browser.cjs
          NODE_PATH="$RUNNER_TEMP/lolo-browser-tests/node_modules" node tests/content-e2e-browser.cjs
      - name: Build debug APK
        run: |
          npm run prepare:web
          npx cap sync android
          test -f android/app/src/main/assets/public/curriculum.json
          test -f android/app/src/main/assets/public/network.js
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Build unsigned release and verify signing with disposable test key
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease
          cd ..
          bash ../scripts/test_android_signing.sh
      - name: Publish APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: lolo-android-debug-apk
          path: android-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Sign release APK with operator key
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release && github.ref == 'refs/heads/main'
        env:
          LOLO_ANDROID_KEYSTORE_BASE64: ${{ secrets.LOLO_ANDROID_KEYSTORE_BASE64 }}
          LOLO_ANDROID_STORE_PASSWORD: ${{ secrets.LOLO_ANDROID_STORE_PASSWORD }}
          LOLO_ANDROID_KEY_ALIAS: ${{ secrets.LOLO_ANDROID_KEY_ALIAS }}
          LOLO_ANDROID_KEY_PASSWORD: ${{ secrets.LOLO_ANDROID_KEY_PASSWORD }}
          LOLO_ANDROID_CERT_SHA256: ${{ vars.LOLO_ANDROID_CERT_SHA256 }}
        run: |
          bash ../scripts/sign_android_release.sh android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/lolo-release.apk"
      - name: Publish signed release APK
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: lolo-android-signed-release-${{ github.run_number }}
          path: ${{ runner.temp }}/lolo-release.apk
          if-no-files-found: error
          retention-days: 30
