name: Family backend verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'family_accounts.py'
      - 'family_credentials.py'
      - 'family_mail.py'
      - 'tests/test_family_mail.py'
      - 'tests/test_family_credentials.py'
      - 'billing.py'
      - 'offline_license.py'
      - 'offline_license_lifecycle.py'
      - 'tests/test_offline_license_lifecycle.py'
      - 'offline_device_proof.py'
      - 'tests/test_offline_device_proof.py'
      - 'tests/test_offline_device_manager.py'
      - 'offline-license.js'
      - 'requirements-offline-license-staging.txt'
      - 'tests/test_offline_license.py'
      - 'tests/offline-license-cross.cjs'
      - 'billing_grants.py'
      - 'remote_config.py'
      - 'tests/test_remote_config.py'
      - 'billing_discounts.py'
      - 'billing_analytics.py'
      - 'tests/test_billing_analytics.py'
      - 'tests/test_billing_discounts.py'
      - 'tests/test_billing_grants.py'
      - 'billing_entitlements.py'
      - 'billing_owner.py'
      - 'staging-billing/**'
      - 'tests/test_billing_preview.py'
      - 'tests/test_billing_owner.py'
      - 'tests/test_billing_entitlements.py'
      - 'tests/test_billing.py'
      - 'homework_storage.py'
      - 'homework_review.py'
      - 'staging-homework/**'
      - 'tests/test_homework_preview.py'
      - 'requirements-homework-staging.txt'
      - 'tests/test_homework_storage.py'
      - 'voice_consent.py'
      - 'pronunciation_contract.py'
      - 'pronunciation_preview.py'
      - 'tests/test_pronunciation_preview.py'
      - 'tests/test_pronunciation_contract.py'
      - 'progress_sync.py'
      - 'database/**'
      - 'api/family.py'
      - 'server.py'
      - 'database_connection.py'
      - 'scripts/verify_neon_schema.py'
      - 'scripts/verify_neon_build.sh'
      - 'tests/test_neon_schema_verification.py'
      - 'vercel.json'
      - 'scripts/prepare_vercel_public.js'
      - 'tests/vercel-public.test.cjs'
      - 'offline-assets.js'
      - 'tests/test_database_connection.py'
      - 'request_budget.py'
      - 'tests/test_request_budget.py'
      - 'tests/test_security_basics.py'
      - 'requirements.txt'
      - 'tests/test_family_accounts.py'
      - 'tests/test_hosted_family_pilot.py'
      - 'tests/test_progress_sync.py'
      - 'scripts/family_admin.py'
      - '.github/workflows/family-backend.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lolo_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: lolo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lolo_test -d lolo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      pilot:
        image: postgres:16
        env:
          POSTGRES_USER: lolo_pilot
          POSTGRES_PASSWORD: disposable-pilot-only
          POSTGRES_DB: lolo_pilot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lolo_pilot -d lolo_pilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOLO_TEST_PILOT_DATABASE_URL: postgresql://lolo_pilot:disposable-pilot-only@127.0.0.1:5433/lolo_pilot
      LOLO_TEST_DATABASE_URL: postgresql://lolo_test:disposable-ci-only@127.0.0.1:5432/lolo_test
      LOLO_FAMILY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install PostgreSQL driver
        run: python3 -m venv .venv && .venv/bin/pip install -r requirements.txt -r requirements-homework-staging.txt -r requirements-offline-license-staging.txt
      - name: Test isolated family database
        run: |
          .venv/bin/python -m unittest discover -s tests -p 'test_family_accounts.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_family_credentials.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_family_mail.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_hosted_family_pilot.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_progress_sync.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_pronunciation_contract.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_homework_storage.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_homework_preview.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_billing.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_billing_entitlements.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_billing_owner.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_billing_preview.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_billing_grants.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_offline_license.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_offline_device_proof.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_billing_discounts.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_offline_device_manager.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_offline_license_lifecycle.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_remote_config.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_pronunciation_preview.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_request_budget.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_security_basics.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_database_connection.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_neon_schema_verification.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_billing_analytics.py' -v
      - name: Verify Vercel browser asset output
        run: node tests/vercel-public.test.cjs
