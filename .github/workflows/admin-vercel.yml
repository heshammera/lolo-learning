name: Independent Vercel administration
on:
  push:
    paths:
      - 'admin-vercel/**'
      - 'admin-src/**'
      - 'family_accounts.py'
      - 'activity-engine.js'
      - 'activity-pilot.js'
      - 'content-schema.js'
      - '.github/workflows/admin-vercel.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node admin-vercel/sync.cjs --check && node admin-vercel/prepare.cjs
      - run: python -m pip install -r admin-vercel/requirements.txt
      - run: python -m unittest discover -s admin-vercel/tests -v
